# =============================================================================
# MetalMotifExtractor — Configuration File
# =============================================================================
# All parameters can be overridden via CLI flags.  Values set here act as
# defaults when the corresponding flag is not supplied on the command line.
# =============================================================================

# ---------------------------------------------------------------------------
# Metal ion(s) of interest
# Use the residue name(s) exactly as they appear in PDB HETATM records.
# A single value or a YAML list is accepted.
#
# Single metal:          metal: "CA"
# Multiple metals:       metal: ["CA", "MG"]
# ALL metals (any form): metal: "any"
#
# Using "any" disables the per-structure metal presence filter at the
# discovery stage and searches every downloaded structure for all known
# biologically relevant metal ions. This is the correct setting when using
# --mode uniprot and you want ALL crystal forms of EF-hand proteins
# regardless of which metal they contain (Ca2+, Mg2+, La3+, apo, etc.).
# ---------------------------------------------------------------------------
metal: "any"

# ---------------------------------------------------------------------------
# Input mode
# Options:
#   "excel"   — read PDB IDs from an Excel (.xlsx) file
#   "text"    — read PDB IDs from a plain-text file (one ID per line)
#   "uniprot" — automatically discover protein structures via the UniProt
#               REST API using a configurable domain query. Default query
#               targets EF-hand proteins; change uniprot_query below to
#               target any other protein family with Swiss-Prot annotations.
# ---------------------------------------------------------------------------
input_mode: "uniprot"

# Path to input file (used only for modes "excel" and "text")
input_file: "input.xlsx"

# ---------------------------------------------------------------------------
# Resolution filter (Å)
# Only X-ray / cryo-EM structures with resolution ≤ this value are kept.
# NMR structures lack a numeric resolution; they are excluded by default
# unless include_nmr: true is set.
# ---------------------------------------------------------------------------
max_resolution: 2.0
include_nmr: false

# ---------------------------------------------------------------------------
# Allowed experimental methods
# Only structures obtained by one of the listed methods are processed.
# ---------------------------------------------------------------------------
allowed_methods:
  - "X-RAY DIFFRACTION"
  # - "ELECTRON MICROSCOPY"

# ---------------------------------------------------------------------------
# Motif extraction parameters
# ---------------------------------------------------------------------------
distance_cutoff: 2.8      # Å — protein donor atoms (side-chain O/N/S and backbone
                           # carbonyl O) within this distance of the ion are donors;
                           # the same cut-off for side-chain and backbone atoms.
                           # Water and non-protein ligand cut-offs follow this value
                           # unless water_cutoff / ligand_cutoff are set.
motif_length: 15          # number of residues in the extracted window
                           # (odd values recommended so the window is symmetric)

# ---------------------------------------------------------------------------
# Per-metal protein-donor cutoffs (Angstrom)
# Metal-ligand distances differ between metals, so one cutoff is rarely ideal
# for all of them.  Entries here override distance_cutoff for that metal; the
# cutoff actually used is written to the "Distance Cutoff" column.  Choose the
# values from a cutoff sweep on a curated benchmark.  Example:
#   metal_cutoffs: {ZN: 2.8, CA: 3.2}
# ---------------------------------------------------------------------------
metal_cutoffs: {}

# ---------------------------------------------------------------------------
# Coordinated water
#
# include_water: true  -> every water whose OXYGEN lies within water_cutoff of
#                         the metal is (i) counted and listed in
#                         motif_metadata.csv (Water Count / Water IDs / Water
#                         Distances) and (ii) written, with its coordinates,
#                         into the motif PDB file.
# water_cutoff (A)     -> metal...O(water) distance.  This is deliberately
#                         separate from distance_cutoff (which applies to
#                         protein donors) because typical metal-water bonds
#                         are 2.0-2.6 A and a 4 A cutoff would also collect
#                         second-shell waters.  Waters are searched in ALL
#                         chains of the model.
# ---------------------------------------------------------------------------
include_water: true
# water_cutoff: <Å>       # default: the same as the protein cut-off

# ---------------------------------------------------------------------------
# Non-protein ligands (nucleotides, cofactors, substrates, anions, glycans,
# nucleic-acid phosphates, ...)
#
# include_ligands: true -> every N, O or S atom of a residue that is neither
#                          an amino acid nor water, within ligand_cutoff of the
#                          metal, is (i) counted and listed in motif_metadata.csv
#                          (Ligand Atom Count / Residues / Atoms / Distances)
#                          and (ii) the whole ligand residue is written, with
#                          coordinates, into the motif PDB file.
# ligand_cutoff (A)     -> metal...donor-atom distance for these ligands.
#
# Single-atom metal ions are never counted as ligands.  Residues with names
# typical of crystallisation additives (glycerol, ethylene glycol, PEG,
# sulfate, acetate, ...) are counted but FLAGGED in "Common Additive
# Residues"; nothing is excluded.
# ---------------------------------------------------------------------------
include_ligands: true
# ligand_cutoff: <Å>      # default: the same as the protein cut-off

# ---------------------------------------------------------------------------
# Coordination geometry
#
# The geometry is the ideal polyhedron that best fits the donor atoms
# (template fitting; RMSD in Angstrom is reported with the runner-up and the
# margin).  By default NO threshold is applied: the best fit is always the
# label.  Set geometry_max_rmsd (A) to label poorly fitting sites "Irregular";
# choose the value from your benchmark.  null = no threshold.
# ---------------------------------------------------------------------------
geometry_max_rmsd: null

# ---------------------------------------------------------------------------
# FindGeo comparison (optional)
# write_findgeo_input: true -> for every motif write <motif_id>.pdb into
# findgeo_dir containing the metal and EXACTLY the donor atoms counted for the
# coordination number, so FindGeo can be run on identical atoms
# (see findgeo_compare.py).
# ---------------------------------------------------------------------------
write_findgeo_input: false
findgeo_dir: "findgeo_inputs"

# ---------------------------------------------------------------------------
# Models
# "all"   -> every model of a multi-model file, each processed independently
#            (default; an ion is only ever matched to residues/waters of its
#            own model).  X-ray structures usually have a single model, so
#            this mainly matters for NMR ensembles (--include_nmr).
# "first" -> only the first model (command line: --model first or
#            --first_model_only)
# ---------------------------------------------------------------------------
model_policy: "all"

# ---------------------------------------------------------------------------
# Biological assembly vs. asymmetric unit
# true  → download the deposited biological assembly (assembly 1)
# false → use the asymmetric unit (default PDB file)
# ---------------------------------------------------------------------------
use_biological_assembly: false

# ---------------------------------------------------------------------------
# File format of the asymmetric unit: "pdb" (default) or "cif" (mmCIF).
# The same entry must give the same motifs in both formats; running a set of
# entries both ways is a check on format handling.  (The biological assembly
# is always mmCIF, and is a DIFFERENT set of chains from the asymmetric unit,
# so its motif count is expected to differ.)
# ---------------------------------------------------------------------------
asu_format: "pdb"

# ---------------------------------------------------------------------------
# Parallel download settings
# max_workers: number of simultaneous download threads
# ---------------------------------------------------------------------------
max_workers: 8

# ---------------------------------------------------------------------------
# SSL certificate verification
#
# Set to false if you are behind an institutional VPN, university proxy,
# or corporate firewall that performs SSL inspection. These systems
# intercept HTTPS traffic and present their own certificate, which causes
# "certificate verify failed: Hostname mismatch" errors.
#
# Symptom: SSLError / CERTIFICATE_VERIFY_FAILED in the log.
# Fix:     ssl_verify: false
#
# You can also pass --no_ssl_verify on the command line.
# ---------------------------------------------------------------------------
ssl_verify: true   # Set to false for institutional networks with SSL inspection (IIT)

# ---------------------------------------------------------------------------
# UniProt discovery query (used only for --mode uniprot)
#
# This is the query sent to the UniProt REST API to discover protein
# structures.  Change this to target any protein family that has curated
# domain annotations in Swiss-Prot.
#
# IMPORTANT - how the query is used: the string is sent to UniProt EXACTLY as
# written (the tool does not add or change anything).  Plain words with no
# field name (e.g.  Zinc finger, C2H2-type ) are a free-text search over all
# fields of all entries, including unreviewed ones: much broader than a domain
# annotation.  Use a field query such as  (ft_domain:"EF-hand") AND
# (reviewed:true) .  Text in double quotes is matched as a phrase.
#
# CAUTION - feature type: UniProt records some zinc-finger types as "Zinc
# finger" features (field ft_zn_fing, e.g. note "C2H2-type 1"), NOT as DOMAIN
# features.  The ft_domain examples below for C2H2, RING, PHD and FYVE fingers
# may therefore return few or no entries.  For C2H2 try
#     (ft_zn_fing:"C2H2-type") AND (reviewed:true)
# and CHECK the number of hits on https://www.uniprot.org/uniprotkb before a
# long run (it should match "UniProt entries returned" in the summary).
#
# The query must be a valid UniProt REST API query string.
# See: https://www.uniprot.org/help/query-fields
#
# Examples:
#   EF-hand (Ca2+, default):
#     uniprot_query: '(ft_domain:"EF-hand") AND (reviewed:true)'
#
#   C2H2 zinc finger:
#     uniprot_query: '(ft_domain:"Zinc finger, C2H2-type") AND (reviewed:true)'
#
#   RING finger (E3 ligase, Zn2+):
#     uniprot_query: '(ft_domain:"RING-type zinc finger") AND (reviewed:true)'
#
#   LIM domain (Zn2+):
#     uniprot_query: '(ft_domain:"LIM zinc-binding") AND (reviewed:true)'
#
#   PHD finger (chromatin reader, Zn2+):
#     uniprot_query: '(ft_domain:"PHD-type zinc finger") AND (reviewed:true)'
#
#   Rubredoxin (Fe2+):
#     uniprot_query: '(ft_domain:"Rubredoxin-type") AND (reviewed:true)'
#
#   2Fe-2S ferredoxin:
#     uniprot_query: '(ft_domain:"2Fe-2S ferredoxin-type") AND (reviewed:true)'
#
#   EGF-like calcium-binding:
#     uniprot_query: '(ft_domain:"EGF-like calcium-binding") AND (reviewed:true)'
#
#   FYVE zinc finger:
#     uniprot_query: '(ft_domain:"Zinc finger, FYVE-type") AND (reviewed:true)'
# ---------------------------------------------------------------------------
uniprot_query: '(ft_domain:"EF-hand") AND (reviewed:true)'

# ---------------------------------------------------------------------------
# HTTP Proxy settings
#
# If the tool cannot reach external APIs (RCSB, UniProt) but your browser
# can, your institution routes traffic through a proxy that Python does not
# automatically detect.
#
# Find your proxy address from your browser:
#   Chrome/Edge: Settings → System → Open proxy settings
#   Firefox:     Settings → Network Settings → Manual proxy
#   Or ask your IT helpdesk.
#
# Common IITGN proxy: http://fwg.iitgn.ac.in:80
#
# Examples:
#   proxy: "http://proxy.iitgn.ac.in:8080"
#   proxy: "http://fwg.iitgn.ac.in:80"
#
# Leave as empty string "" if no proxy is needed.
# ---------------------------------------------------------------------------
proxy: ""

# ---------------------------------------------------------------------------
# Output paths
# ---------------------------------------------------------------------------
output_dir: "outputs"
pdb_dir: "pdb_files"
motif_dir: "motif_pdbs"
metadata_dir: "metadata"
log_dir: "logs"
